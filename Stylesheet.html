<style>
  /* Qyona Design System v2.0 — Kantong Impian & Interactive Bot 2-Way */
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  :root {
    --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --emerald-50: #ecfdf5;
    --emerald-100: #d1fae5;
    --emerald-500: #10b981;
    --emerald-600: #059669;
    --teal-600: #0d9488;
    --teal-700: #0f766e;
    --teal-800: #115e59;
    --orange-cat: #f97316;
    --blue-cat: #3b82f6;
    --purple-cat: #a855f7;
    --red-alert: #ef4444;
  }

  body {
    font-family: var(--font-main);
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.35);
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(13, 148, 136, 0.6);
  }

  /* Glassmorphism & Gradients */
  .qyona-gradient {
    background: linear-gradient(135deg, #0f766e 0%, #059669 55%, #10b981 100%);
  }

  .qyona-login-bg {
    background: radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(13, 148, 136, 0.16) 0%, transparent 50%);
  }

  .chat-bubble-user {
    background: linear-gradient(135deg, #0d9488 0%, #059669 100%);
    color: #ffffff;
    border-radius: 18px 18px 4px 18px;
  }

  .chat-bubble-bot {
    border-radius: 18px 18px 18px 4px;
  }

  /* Pulse recording mic */
  @keyframes pulseRing {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }
  .mic-recording {
    animation: pulseRing 1.5s infinite;
    background-color: #ef4444 !important;
    color: #ffffff !important;
  }

  /* Smooth fade-in */
  @keyframes fadeInSlide {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fadeInSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Progress bar smooth transition */
  .progress-fill {
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* 1. Tulisan Finance Emas dengan Outline Putih Tipis */
  .qyona-finance-subtitle {
    color: #f59e0b;
    letter-spacing: 0.22em;
    font-weight: 900;
    text-shadow: 
      -0.6px -0.6px 0 #ffffff,
       0.6px -0.6px 0 #ffffff,
      -0.6px  0.6px 0 #ffffff,
       0.6px  0.6px 0 #ffffff,
       0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .dark .qyona-finance-subtitle {
    color: #fbbf24;
    text-shadow: 
      -0.6px -0.6px 0 rgba(255, 255, 255, 0.8),
       0.6px -0.6px 0 rgba(255, 255, 255, 0.8),
      -0.6px  0.6px 0 rgba(255, 255, 255, 0.8),
       0.6px  0.6px 0 rgba(255, 255, 255, 0.8),
       0 1px 3px rgba(0, 0, 0, 0.6);
  }

  /* 2 & 3. Animasi Garis Tepi RGB Melingkar (Moving RGB Rainbow Gradient) */
  @keyframes rgbBorderFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .rgb-glow-capsule {
    position: relative;
    background: linear-gradient(90deg, #10b981, #06b6d4, #8b5cf6, #ec4899, #f59e0b, #10b981);
    background-size: 300% 300%;
    animation: rgbBorderFlow 5s linear infinite;
    border-radius: 1.25rem;
    padding: 2px;
    transition: all 0.25s ease;
  }
  .rgb-glow-capsule:focus-within {
    box-shadow: 0 0 16px rgba(16, 185, 129, 0.35), 0 0 24px rgba(139, 92, 246, 0.25);
    background-size: 200% 200%;
    animation-duration: 3s;
  }

  .rgb-glow-active-recording {
    background: linear-gradient(90deg, #ef4444, #f97316, #ec4899, #ef4444) !important;
    background-size: 200% 200% !important;
    animation: rgbBorderFlow 1.5s linear infinite !important;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
  }

  .rgb-inner-box {
    background-color: #ffffff;
    border-radius: calc(1.25rem - 2px);
    transition: background-color 0.2s ease;
  }
  .dark .rgb-inner-box {
    background-color: #0f172a;
  }

  /* Auto-grow Textarea */
  .chat-auto-textarea {
    resize: none;
    overflow-y: hidden;
    min-height: 38px;
    max-height: 120px;
    line-height: 1.4;
  }

  /* Chat history list transition */
  .history-item-hover:hover {
    transform: translateX(3px);
  }
</style>
